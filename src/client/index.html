<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BattlePlanetJS</title>
  <link rel="stylesheet" href="/res/style.css">
</head>
<body>
  <div id="login">
    <form action="" id="user">
      <input id="userInput" autocomplete="off" placeholder="Pilot name">
      <button>Login</button>
    </form>
  </div>

  <div id="content" style="display: none;">
    <div id="main">
      <div id="lobby">
        <section class="lobbyHero">
          <div class="panelHeader lobbyHeroHeader">
            <span class="eyebrow">Orbital Arena</span>
            <h1>BattlePlanetJS</h1>
            <p>Create a tuned match, invite pilots in, and fight for orbit control around the sun.</p>
          </div>
          <form action="" id="lobbyForm" class="lobbyComposer">
            <div class="fieldGroup fieldGroupPrimary">
              <label for="lobbyNameInput">Lobby name</label>
              <input id="lobbyNameInput" autocomplete="off" placeholder="Nebula Brawl">
            </div>
            <div class="lobbySettingsGrid">
              <div class="fieldGroup">
                <label for="lobbyBotCount">Bots</label>
                <select id="lobbyBotCount">
                  <option value="0">0</option>
                  <option value="1">1</option>
                  <option value="2" selected>2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
              </div>
              <div class="fieldGroup">
                <label for="lobbyArenaSize">Arena</label>
                <select id="lobbyArenaSize">
                  <option value="compact">Compact</option>
                  <option value="standard" selected>Standard</option>
                  <option value="wide">Wide</option>
                </select>
              </div>
              <div class="fieldGroup">
                <label for="lobbyStarMode">Stars</label>
                <select id="lobbyStarMode">
                  <option value="single" selected>Single Sun</option>
                  <option value="binary">Binary Suns</option>
                </select>
              </div>
              <div class="fieldGroup">
                <label for="lobbyHazards">Hazards</label>
                <select id="lobbyHazards">
                  <option value="none" selected>None</option>
                  <option value="asteroids">Orbiting Asteroids</option>
                </select>
              </div>
              <label class="toggleField" for="lobbyPublicInput">
                <span class="toggleText">Listed publicly</span>
                <input id="lobbyPublicInput" type="checkbox" checked>
                <span class="toggleKnob"></span>
              </label>
            </div>
            <button class="createLobbyButton" type="submit">Launch Lobby</button>
          </form>
        </section>
        <section class="lobbyListSection">
          <div class="sectionHeading">
            <div>
              <span class="eyebrow">Join a Match</span>
              <h2>Open Lobbies</h2>
            </div>
            <p>Pick a room and jump straight into the orbit.</p>
          </div>
          <div id="games"></div>
        </section>
      </div>
      <div id="gameScreen" style="display: none;">
        <div id="gameHeader" class="gameHudBar">
          <div class="gameTitleRow">
            <h1>BattlePlanet</h1>
            <div class="gameActionRow">
              <label class="hudSelectField" for="frameCapSelect">
                <span>Frame Cap</span>
                <select id="frameCapSelect">
                  <option value="30">30</option>
                  <option value="60" selected>60</option>
                  <option value="90">90</option>
                  <option value="120">120</option>
                </select>
              </label>
              <button id="fullscreenToggle" type="button">Fullscreen</button>
            </div>
          </div>
        </div>
        <div id="gameRender"></div>
        <div id="gameControls" class="gameHudBar"></div>
      </div>
    </div>

    <div id="side">
      <div class="panelHeader">
        <h2>Comms</h2>
        <p>Type <code>/leave</code> to go back to the lobby list.</p>
      </div>
      <ul id="messages"></ul>
      <form action="" id="chat">
        <input id="chatInput" autocomplete="off" placeholder="Send a message">
        <button>Send</button>
      </form>
    </div>
  </div>

  <script src="lib/jquery.min.js"></script>
  <script src="src/game.js"></script>
  <script src="src/index.js"></script>
</body>
</html>
