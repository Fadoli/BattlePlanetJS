<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BattlePlanetJS</title>
  <link rel="stylesheet" href="/res/style.css">
</head>
<body>
  <div id="login">
    <form action="" id="user">
      <input id="userInput" autocomplete="off" placeholder="Pilot name">
      <button>Login</button>
    </form>
  </div>

  <div id="content" style="display: none;">
    <div id="main">
      <div id="lobby">
        <div class="panelHeader">
          <h1>BattlePlanetJS</h1>
          <p>Create a lobby to launch the arena, or join one from the list.</p>
        </div>
        <form action="" id="lobbyForm">
          <input id="lobbyNameInput" autocomplete="off" placeholder="Lobby name">
          <button>Create</button>
        </form>
        <div id="games"></div>
      </div>
      <div id="gameRender" style="display: none;"></div>
    </div>

    <div id="side">
      <div class="panelHeader">
        <h2>Comms</h2>
        <p>Type <code>/leave</code> to go back to the lobby list.</p>
      </div>
      <ul id="messages"></ul>
      <form action="" id="chat">
        <input id="chatInput" autocomplete="off" placeholder="Send a message">
        <button>Send</button>
      </form>
    </div>
  </div>

  <script src="lib/jquery.min.js"></script>
  <script src="lib/pixi.min.js"></script>
  <script src="lib/socket.io.js"></script>
  <script src="src/game.js"></script>
  <script src="src/index.js"></script>
</body>
</html>
